<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>وبلاگ ساده</title>
</head>
<body>
    <h1>پست‌ها</h1>
    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <small>نویسنده: {{ post.author }} - {{ post.created_at }}</small>
            <p>{{ post.content }}</p>
        </div>
        <hr>
    {% empty %}
        <p>هیچ پستی هنوز منتشر نشده است.</p>
    {% endfor %}
</body>
</html>
